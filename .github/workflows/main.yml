name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: 'https://vjpmesmvwwyclltibelh.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqcG1lc212d3d5Y2xsdGliZWxoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1Mjk3NzIsImV4cCI6MjEwNjEwNTc3Mn0.Fp_QAn7LFBqpYA20Jpckbh1dJ-cBnbojM5o8tYaL-2s'

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS App
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
          clean build


      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r AvukatAsistanim.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvukatAsistanim-iOS-App
          path: AvukatAsistanim.ipa
          retention-days: 14
